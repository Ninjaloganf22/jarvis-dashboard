
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>J.A.R.V.I.S.</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#050a13;color:#e8faff;font-family:Arial,sans-serif}
main{max-width:900px;margin:auto;padding:24px}
header{display:flex;justify-content:space-between;align-items:center;
border-bottom:1px solid #16485b;padding-bottom:18px}
h1{color:#48e5ff;letter-spacing:5px;font-size:25px}
.status{color:#59ffb0;font-size:12px}
.clock{font-size:clamp(48px,12vw,90px);font-weight:200;margin:35px 0 0}
.date{color:#75a4b5;letter-spacing:3px}
.panel{background:#0b1625;border:1px solid #16485b;
border-radius:18px;padding:22px;margin-top:25px}
.label{font-size:12px;letter-spacing:3px;color:#48e5ff}
.track{display:flex;gap:20px;align-items:center;margin-top:18px}
.art{width:150px;height:150px;object-fit:cover;background:#132638;
border-radius:12px}
.song{font-size:24px;font-weight:bold;overflow-wrap:anywhere}
.artist{color:#91adbd;margin-top:9px}
button{background:#48e5ff;color:#03101a;border:0;border-radius:25px;
padding:13px 20px;font-weight:bold;cursor:pointer;margin-top:16px}
button:disabled{opacity:.5}
.small{font-size:13px;color:#91adbd;line-height:1.6}
.controls{margin-top:18px;max-width:420px}
.control-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.control-row button{margin-top:0;min-width:54px}
button.secondary{background:#132638;color:#dffaff;border:1px solid #246075}
.volume-row{display:flex;align-items:center;gap:12px;margin-top:16px;color:#91adbd;font-size:13px}
input[type=range]{width:100%;accent-color:#48e5ff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:500px){.track{align-items:flex-start;flex-direction:column}
.art{width:100%;height:auto;aspect-ratio:1}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<header>
<h1>J.A.R.V.I.S.</h1>
<div class="status">● SYSTEM ONLINE</div>
</header>

<div class="clock" id="clock">00:00</div>
<div class="date" id="date"></div>

<section class="panel">
<div class="label">♫ NOW PLAYING</div>
<div class="track">
<img class="art" id="art"
src="https://placehold.co/300x300/102333/48e5ff?text=JARVIS"
alt="Album artwork">
<div>
<div class="song" id="song">Awaiting Spotify</div>
<div class="artist" id="artist">Connect your account to begin</div>
<button id="connect">CONNECT SPOTIFY</button>
<div class="controls">
<div class="control-row">
<button class="secondary" id="previous" aria-label="Previous track" disabled>⏮</button>
<button id="playpause" aria-label="Play or pause" disabled>▶ PLAY</button>
<button class="secondary" id="next" aria-label="Next track" disabled>⏭</button>
</div>
<div class="volume-row">
<label for="volume">VOLUME</label>
<input id="volume" type="range" min="0" max="100" value="50" disabled>
<span id="volume-value">—</span>
</div>
</div>
<p class="small" id="message">
Your phone plays the music. Jarvis displays the track here.
</p>
</div>
</div>
</section>

<div class="grid">
<section class="panel">
<div class="label">SYSTEM</div>
<p>Dashboard: <span class="status">ONLINE</span></p>
<p class="small">Fire HD 8 · Jarvis interface</p>
</section>
<section class="panel">
<div class="label">MTB PROJECTS</div>
<p>Mondraker Foxy RR</p>
<p class="small">Bike maintenance and ride planning</p>
</section>
</div>
</main>

<script>
function updateClock(){
 const now=new Date();
 document.getElementById('clock').textContent=
 now.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
 document.getElementById('date').textContent=
 now.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).toUpperCase();
}
updateClock();
setInterval(updateClock,1000);

// Spotify Authorization Code with PKCE — no client secret in this public page.
const SPOTIFY_CLIENT_ID = 'bce19036b4474cf2a679cca1412e07c6';
const REDIRECT_URI = 'https://ninjaloganf22.github.io/jarvis-dashboard/';
const SCOPES = 'user-read-currently-playing user-read-playback-state user-modify-playback-state';
const connectButton = document.getElementById('connect');
const message = document.getElementById('message');
const songEl = document.getElementById('song');
const artistEl = document.getElementById('artist');
const artEl = document.getElementById('art');

function randomString(length){
 const chars='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~';
 const bytes=new Uint8Array(length);
 crypto.getRandomValues(bytes);
 return Array.from(bytes,b=>chars[b%chars.length]).join('');
}
function base64UrlEncode(bytes){
 return btoa(String.fromCharCode(...bytes)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
async function makeChallenge(verifier){
 const digest=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(verifier));
 return base64UrlEncode(new Uint8Array(digest));
}
async function connectSpotify(){
 try{
  const verifier=randomString(64);
  const challenge=await makeChallenge(verifier);
  localStorage.setItem('jarvis_spotify_verifier',verifier);
  const params=new URLSearchParams({
   response_type:'code',
   client_id:SPOTIFY_CLIENT_ID,
   scope:SCOPES,
   redirect_uri:REDIRECT_URI,
   code_challenge_method:'S256',
   code_challenge:challenge
  });
  location.href='https://accounts.spotify.com/authorize?'+params.toString();
 }catch(e){
  message.textContent='Could not start Spotify login. Please use a secure connection and try again.';
 }
}
async function exchangeCode(code){
 const verifier=localStorage.getItem('jarvis_spotify_verifier');
 if(!verifier) throw new Error('Missing login verifier');
 const body=new URLSearchParams({
  client_id:SPOTIFY_CLIENT_ID,
  grant_type:'authorization_code',
  code,
  redirect_uri:REDIRECT_URI,
  code_verifier:verifier
 });
 const response=await fetch('https://accounts.spotify.com/api/token',{
  method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body
 });
 const data=await response.json();
 if(!response.ok) throw new Error(data.error_description||data.error||'Token exchange failed');
 localStorage.setItem('jarvis_spotify_access_token',data.access_token);
 if(data.refresh_token) localStorage.setItem('jarvis_spotify_refresh_token',data.refresh_token);
 localStorage.setItem('jarvis_spotify_expires_at',String(Date.now()+data.expires_in*1000));
 localStorage.removeItem('jarvis_spotify_verifier');
}
async function refreshToken(){
 const refresh=localStorage.getItem('jarvis_spotify_refresh_token');
 if(!refresh) return false;
 const body=new URLSearchParams({client_id:SPOTIFY_CLIENT_ID,grant_type:'refresh_token',refresh_token:refresh});
 const response=await fetch('https://accounts.spotify.com/api/token',{
  method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body
 });
 const data=await response.json();
 if(!response.ok) return false;
 localStorage.setItem('jarvis_spotify_access_token',data.access_token);
 if(data.refresh_token) localStorage.setItem('jarvis_spotify_refresh_token',data.refresh_token);
 localStorage.setItem('jarvis_spotify_expires_at',String(Date.now()+data.expires_in*1000));
 return true;
}
async function getAccessToken(){
 let token=localStorage.getItem('jarvis_spotify_access_token');
 const expires=Number(localStorage.getItem('jarvis_spotify_expires_at')||0);
 if(token && Date.now()<expires-60000) return token;
 if(await refreshToken()) return localStorage.getItem('jarvis_spotify_access_token');
 localStorage.removeItem('jarvis_spotify_access_token');
 return null;
}
const playPauseButton=document.getElementById('playpause');
const previousButton=document.getElementById('previous');
const nextButton=document.getElementById('next');
const volumeSlider=document.getElementById('volume');
const volumeValue=document.getElementById('volume-value');
let isPlaying=false;
let currentVolume=50;
function setControlsEnabled(enabled){
 playPauseButton.disabled=!enabled;
 previousButton.disabled=!enabled;
 nextButton.disabled=!enabled;
 volumeSlider.disabled=!enabled;
}
async function spotifyCommand(path,method='PUT',body=null){
 const token=await getAccessToken();
 if(!token) throw new Error('Your Spotify login has expired. Tap DISCONNECT, then reconnect Spotify.');
 // Choose the active device, or fall back to an available Spotify Connect device.
 let deviceId=null;
 try{
  const devicesResponse=await fetch('https://api.spotify.com/v1/me/player/devices',{
   headers:{Authorization:'Bearer '+token}
  });
  if(devicesResponse.ok){
   const devicesData=await devicesResponse.json();
   const devices=devicesData.devices||[];
   const device=devices.find(d=>d.is_active)||devices.find(d=>!d.is_restricted)||devices[0];
   if(device&&device.id) deviceId=device.id;
  }else if(devicesResponse.status===401){
   localStorage.removeItem('jarvis_spotify_access_token');
   throw new Error('Spotify login expired. Tap DISCONNECT and reconnect.');
  }
 }catch(e){
  if(e.message&&e.message.includes('login expired')) throw e;
 }
 let commandPath=path;
 if(deviceId){
  commandPath+=(commandPath.includes('?')?'&':'?')+'device_id='+encodeURIComponent(deviceId);
 }
 const options={method,headers:{Authorization:'Bearer '+token}};
 if(body!==null){
  options.headers['Content-Type']='application/json';
  options.body=JSON.stringify(body);
 }
 const response=await fetch('https://api.spotify.com/v1/me/player'+commandPath,options);
 if(!response.ok && response.status!==204){
  if(response.status===401) localStorage.removeItem('jarvis_spotify_access_token');
  let detail='';
  try{
   const data=await response.json();
   detail=(data.error&&data.error.message)||data.message||'';
   if(data.error&&data.error.reason) detail+=' ('+data.error.reason+')';
  }catch(e){}
  if(response.status===403){
   throw new Error(detail||'Spotify denied playback control. Disconnect and reconnect Jarvis to grant playback-control permission.');
  }
  if(response.status===404){
   throw new Error(detail||'No Spotify playback device found. Open Spotify on your phone or tablet and start playing music.');
  }
  if(response.status===401) throw new Error('Spotify login expired. Tap DISCONNECT and reconnect.');
  throw new Error('Spotify error '+response.status+(detail?': '+detail:'')+'.');
 }
}
async function runSpotifyCommand(action){
 try{
  if(action==='toggle'){
   await spotifyCommand(isPlaying?'/pause':'/play','PUT');
   isPlaying=!isPlaying;
  }else if(action==='next'){
   await spotifyCommand('/next','POST');
  }else if(action==='previous'){
   await spotifyCommand('/previous','POST');
  }else if(action==='volume'){
   await spotifyCommand('/volume?volume_percent='+encodeURIComponent(currentVolume),'PUT');
  }
  message.textContent='Command sent to Spotify.';
  setTimeout(loadNowPlaying,700);
 }catch(e){
  message.textContent=e.message||'Could not control Spotify. Open Spotify on a device and try again.';
 }
}
playPauseButton.addEventListener('click',()=>runSpotifyCommand('toggle'));
nextButton.addEventListener('click',()=>runSpotifyCommand('next'));
previousButton.addEventListener('click',()=>runSpotifyCommand('previous'));
volumeSlider.addEventListener('input',()=>{
 currentVolume=Number(volumeSlider.value);
 volumeValue.textContent=currentVolume+'%';
});
volumeSlider.addEventListener('change',()=>runSpotifyCommand('volume'));

async function loadNowPlaying(){
 const token=await getAccessToken();
 if(!token){
  songEl.textContent='Awaiting Spotify';
  artistEl.textContent='Connect your account to begin';
  connectButton.textContent='CONNECT SPOTIFY';
  setControlsEnabled(false);
  message.textContent='Tap Connect Spotify and approve access to playback and control permissions.';
  return;
 }
 try{
  const stateResponse=await fetch('https://api.spotify.com/v1/me/player',{
   headers:{Authorization:'Bearer '+token}
  });
  if(stateResponse.ok){
   const state=await stateResponse.json();
   isPlaying=!!state.is_playing;
   currentVolume=state.device&&typeof state.device.volume_percent==='number'?state.device.volume_percent:currentVolume;
   playPauseButton.textContent=isPlaying?'❚❚ PAUSE':'▶ PLAY';
   volumeSlider.value=String(currentVolume);
   volumeValue.textContent=currentVolume+'%';
   setControlsEnabled(true);
  }else if(stateResponse.status===204){
   setControlsEnabled(true);
  }else{
   setControlsEnabled(false);
  }
  const response=await fetch('https://api.spotify.com/v1/me/player/currently-playing',{
   headers:{Authorization:'Bearer '+token}
  });
  if(response.status===204){
   songEl.textContent='Nothing playing';
   artistEl.textContent='Start playing something on Spotify';
   connectButton.textContent='DISCONNECT';
   return;
  }
  if(response.status===401){
   localStorage.removeItem('jarvis_spotify_access_token');
   return;
  }
  if(!response.ok) throw new Error('Spotify returned '+response.status);
  const data=await response.json();
  if(!data.item){
   songEl.textContent='Nothing playing';
   artistEl.textContent='Start playing something on Spotify';
   return;
  }
  songEl.textContent=data.item.name||'Unknown track';
  artistEl.textContent=(data.item.artists||[]).map(a=>a.name).join(', ');
  if(data.item.album && data.item.album.images && data.item.album.images[0]){
   artEl.src=data.item.album.images[0].url;
  }
  connectButton.textContent='DISCONNECT';
  isPlaying=!!data.is_playing;
  playPauseButton.textContent=isPlaying?'❚❚ PAUSE':'▶ PLAY';
  message.textContent=data.is_playing?'Now playing on Spotify':'Spotify is paused';
 }catch(e){
  message.textContent='Could not load playback. Open Spotify and try again.';
 }
}
connectButton.addEventListener('click',()=>{
 if(localStorage.getItem('jarvis_spotify_refresh_token')||localStorage.getItem('jarvis_spotify_access_token')){
  localStorage.removeItem('jarvis_spotify_access_token');
  localStorage.removeItem('jarvis_spotify_refresh_token');
  localStorage.removeItem('jarvis_spotify_expires_at');
  songEl.textContent='Awaiting Spotify';
  artistEl.textContent='Connect your account to begin';
  artEl.src='https://placehold.co/300x300/102333/48e5ff?text=JARVIS';
  connectButton.textContent='CONNECT SPOTIFY';
  setControlsEnabled(false);
  message.textContent='Spotify disconnected from this dashboard.';
 }else{
  connectSpotify();
 }
});
(async function initSpotify(){
 const params=new URLSearchParams(location.search);
 const code=params.get('code');
 const error=params.get('error');
 if(error){
  message.textContent='Spotify login was cancelled or denied. Tap Connect Spotify to try again.';
  history.replaceState({},document.title,REDIRECT_URI);
  return;
 }
 if(code){
  connectButton.disabled=true;
  message.textContent='Connecting to Spotify…';
  try{
   await exchangeCode(code);
   history.replaceState({},document.title,REDIRECT_URI);
   message.textContent='Spotify connected.';
  }catch(e){
   message.textContent='Spotify connection failed. Check the Client ID and redirect URI, then try again.';
   history.replaceState({},document.title,REDIRECT_URI);
  }finally{
   connectButton.disabled=false;
  }
 }
 await loadNowPlaying();
 setInterval(loadNowPlaying,15000);
})();
</script>
</body>
</html>
